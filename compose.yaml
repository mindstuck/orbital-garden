services:

# ========== Python Server ==========
  py-server:
    build: ./py-server   # Folder containing Dockerfile & code
    container_name: py-server 
    ports:
      - "8400:8000"
    volumes:
      - ./py-server:/app
      - ./py-server/cuda_libs:/opt/cuda_libs:ro
      - huggingface_cache:/root/.cache/huggingface   # persists model downloads
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://ai:${POSTGRES_PASSWORD}@db:5432/ai
      - LLM_API_URL=http://llama-server:8000/v1
    depends_on:
      - llama-server
      - db
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# ========== LLM Server ==========      
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b5343
    container_name: llama-server
    command: >
      -m /models/L3-8B-Stheno-v3.2-Q4_K_M.gguf
      --host 0.0.0.0 --port 8000
      -ngl 24 -c 8192 -np 1 -fa on
      --cache-type-k q8_0 --cache-type-v q8_0
    volumes:
      - ./models:/models
    ports:
      - "8300:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ========== Database ==========
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

