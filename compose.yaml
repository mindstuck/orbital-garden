services:

# ========== Python Server (only client-facing service) ==========
  py-server:
    build: ./py-server   # Folder containing Dockerfile & code
    container_name: py-server
    ports:
      # Only the user-facing endpoint is published. Set PY_SERVER_BIND to
      # 127.0.0.1 for local-only access.
      - "${PY_SERVER_BIND:-0.0.0.0}:${PY_SERVER_PORT:-8400}:8000"
    volumes:
      - ./py-server:/app
      - ./py-server/cuda_libs:/opt/cuda_libs:ro
      - huggingface_cache:/root/.cache/huggingface   # persists model downloads
    env_file:
      - .env
    environment:
      # Internal service DNS over plain HTTP. Override to target another
      # OpenAI-compatible endpoint if needed.
      - LLM_API_URL=${LLM_API_URL:-http://llama-server:8000/v1}
      # Optional client-facing TLS. Set BOTH and mount certificate material
      # read-only (e.g. - ./py-server/certs:/certs:ro). Leave unset to serve
      # plain HTTP behind a reverse proxy or directly on the LAN.
      - SSL_CERTFILE=${SSL_CERTFILE:-}
      - SSL_KEYFILE=${SSL_KEYFILE:-}
      # Opt-in development auto-reload; keep unset/0 in normal use.
      - UVICORN_RELOAD=${UVICORN_RELOAD:-0}
    depends_on:
      - llama-server
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# ========== LLM Server (internal only) ==========
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b5343
    container_name: llama-server
    command: >
      -m /models/L3-8B-Stheno-v3.2-Q4_K_M.gguf
      --host 0.0.0.0 --port 8000
      -ngl 24 -c 8192 -np 1 -fa on
      --cache-type-k q8_0 --cache-type-v q8_0
    volumes:
      - ./models:/models:ro
    expose:
      - "8000"   # reachable on the Compose network, not published to the host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ========== Database (optional, not started by default) ==========
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: db
    # Enabled with `docker compose --profile db up`. Not consumed by the
    # pipeline until the persistence milestone; see ADR 0002.
    profiles: ["db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"   # reachable on the Compose network, not published to the host

  # 9router and ollama are not active services; see
  # docs/examples/compose-services.md for reference definitions.

volumes:
  huggingface_cache:
  db_data:
