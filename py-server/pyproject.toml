[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["store/migrations", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["config.py", "personas.py", "api", "pipeline", "providers", "store", "tools", "main.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
